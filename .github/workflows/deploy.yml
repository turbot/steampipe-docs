name: Trigger Vercel deploy (prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_LINK_PROD }}

  update-search-records:
    runs-on: ubuntu-latest
    steps:
      - name: Create a token for the Turbot Web Builds app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WEB_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEB_BUILDS_APP_PRIVATE_KEY }}
          owner: turbot
          repositories: steampipe.io

      - name: Trigger search records update in steampipe.io
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          default_branch="$(gh api repos/turbot/steampipe.io --jq .default_branch)"
          gh workflow run update-search-records.yml -R turbot/steampipe.io --ref "$default_branch"
