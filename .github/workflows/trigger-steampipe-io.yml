name: Trigger the preview build in steampipe.io

on:
  workflow_dispatch:

  push:
    branches-ignore: 
      - "main"

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Create a token for the Turbot Web Builds app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.WEB_BUILDS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WEB_BUILDS_APP_PRIVATE_KEY }}
          owner: turbot
          repositories: steampipe.io

      - name: Start the preview build in steampipe.io
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_REF_NAME: ${{ github.ref_name }}
        run: |
          default_branch="$(gh api repos/turbot/steampipe.io --jq .default_branch)"
          gh workflow run build-preview.yml -R turbot/steampipe.io --ref "$default_branch" \
            -f ref_name="$DOCS_REF_NAME"


  preview-link:
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork's pushes start no preview build, so a link for one would be false.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Link the preview as a status on the PR's head commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // A status, not a comment: a comment from github-actions[bot] counts as
            // an outsider's text to the fleet's public-repo guard and holds the PR.
            // steampipe.io builds the branch docs/<PR branch> through Vercel's Git
            // integration. Vercel names that preview
            // steampipe-io-git-docs-<branch, lower-cased, only a-z 0-9 and "-">-turbot,
            // and shortens a host over 63 characters with a hash nobody can reproduce.
            // steampipe.io's build-preview refuses a name outside ^[A-Za-z0-9._/-]+$ and builds
            // nothing for it, so such a branch gets no preview at all.
            const ref = process.env.PR_HEAD_REF;
            const accepted = /^[A-Za-z0-9._\/-]+$/.test(ref);
            const clean = ref.toLowerCase().replace(/[^a-z0-9-]/g, '');
            const host = `steampipe-io-git-docs-${clean}-turbot`;
            const hasLink = accepted && clean !== '' && host.length <= 63;
            const all = 'https://github.com/turbot/steampipe.io/deployments/Preview';

            const status = !accepted
              ? {
                  state: 'failure',
                  description: 'No preview: the branch name has a character the build refuses. Use only letters, digits, . _ / and -.',
                }
              : hasLink
              ? {
                  state: 'success',
                  target_url: `https://${host}.vercel.app`,
                  description: 'Details opens the preview of this branch. It can take a few minutes to build.',
                }
              : {
                  state: 'success',
                  target_url: all,
                  description: 'No link can be worked out for this branch name. Details lists every preview (Turbot people only).',
                };

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_HEAD_SHA,
              context: 'steampipe.io preview',
              ...status,
            });
